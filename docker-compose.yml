services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - dbdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      retries: 10

  # Full stack (docker compose --profile full up -d --build): Apache + Spring Boot + PostgreSQL
  backend:
    profiles: ["full"]
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    # Stripe, admin, Turnstile and the rest come from .env; the lines below only adapt what differs inside Docker
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      EBOOK_STORAGE_PATH: /app/storage/ebooks
      COVER_STORAGE_PATH: /app/storage/covers
      PUBLIC_BASE_URL: ${WEB_PUBLIC_URL:-http://localhost:8081}
    volumes:
      - ebooks:/app/storage/ebooks
      - covers:/app/storage/covers
      - logs:/app/logs
    depends_on:
      db:
        condition: service_healthy

  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  dbdata:
  ebooks:
  covers:
  logs:
