ServerRoot "/usr/local/apache2"
Listen 80

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule dir_module modules/mod_dir.so
LoadModule alias_module modules/mod_alias.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule headers_module modules/mod_headers.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule filter_module modules/mod_filter.so
LoadModule deflate_module modules/mod_deflate.so

User daemon
Group daemon
ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

ErrorLog /proc/self/fd/2
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog /proc/self/fd/1 common
TypesConfig conf/mime.types

# Smaller downloads for text files (images are already compressed)
AddOutputFilterByType DEFLATE text/html text/css text/plain text/javascript application/javascript application/json application/xml image/svg+xml

DocumentRoot "/usr/local/apache2/htdocs"

<Directory />
    AllowOverride None
    Require all denied
</Directory>

<Directory "/usr/local/apache2/htdocs">
    Options -Indexes
    AllowOverride All
    Require all granted
</Directory>

ProxyPass /api http://backend:8080/api
ProxyPassReverse /api http://backend:8080/api
ProxyPass /sitemap.xml http://backend:8080/sitemap.xml
ProxyPass /robots.txt http://backend:8080/robots.txt
ProxyPreserveHost On

# The backend limits requests per client address, so it must only see the address Apache saw, never one the visitor made up
RequestHeader unset X-Forwarded-For

# Same 12 MB upload limit as the backend (a little extra for the multipart envelope); here so it also covers /api
LimitRequestBody 13000000
