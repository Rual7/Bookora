name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: bookora
          POSTGRES_USER: bookora
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bookora -d bookora"
          --health-interval 5s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/bookora
      DB_USER: bookora
      DB_PASSWORD: ci_password
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and test
        working-directory: backend
        run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, lint and build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
