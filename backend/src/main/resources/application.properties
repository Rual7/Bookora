spring.application.name=bookora-backend
spring.config.import=optional:file:../.env[.properties]
# A host such as Render tells the application which port to use through PORT
server.port=${PORT:8080}
server.forward-headers-strategy=native
# DB_URL is a complete JDBC address; a host that gives the parts separately (DB_HOST, DB_PORT, DB_NAME) works too
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bookora}}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.flyway.enabled=true
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${DB_USER}
spring.flyway.password=${DB_PASSWORD}
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=12MB
bookora.storage.covers=${COVER_STORAGE_PATH:./storage/covers}
bookora.storage.ebooks=${EBOOK_STORAGE_PATH:./storage/ebooks}
bookora.demo.ebooks=${DEMO_EBOOKS:true}
bookora.stripe.secret-key=${STRIPE_SECRET_KEY:}
bookora.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
bookora.admin.email=${ADMIN_EMAIL:}
bookora.admin.password=${ADMIN_PASSWORD:}
bookora.rate-limit.requests-per-minute=${RATE_LIMIT_PER_MINUTE:100}
bookora.turnstile.secret=${TURNSTILE_SECRET:}
bookora.turnstile.verify-url=https://challenges.cloudflare.com/turnstile/v0/siteverify
bookora.public-base-url=${PUBLIC_BASE_URL:http://localhost:5173}
server.servlet.session.cookie.http-only=true
# Set COOKIE_SECURE=true when the site is served over HTTPS (the browser then sends the session cookie only over HTTPS)
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
